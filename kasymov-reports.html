<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отчёты — Kasymov ERP</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f3fa;--w:#fff;--s2:#f5f7fb;--bd:#e4e8f0;--bd2:#cdd4e8;
  --tx:#1a1f36;--mu:#5c6380;--hi:#9fa6c0;
  --bl:#378add;--bl-l:#e6f1fb;--bl-d:#0c447c;
  --gn:#3b6d11;--gn-l:#eaf3de;--gn-d:#173404;--gn-m:#639922;
  --rd:#a32d2d;--rd-l:#fcebeb;--rd-d:#501313;--rd-m:#e24b4a;
  --am:#633806;--am-l:#faeeda;--am-d:#412402;--am-m:#ba7517;
  --pu:#3c3489;--pu-l:#eeedfe;--pu-d:#26215c;--pu-m:#7f77dd;
  --tl:#085041;--tl-l:#e1f5ee;--tl-d:#04342c;--tl-m:#1d9e75;
  --r:10px;--rs:7px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden;font-size:14px}

/* SIDEBAR */
.sb{width:56px;background:#0d1523;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex-shrink:0}
.sb-logo{width:36px;height:36px;background:var(--bl);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;margin-bottom:10px;cursor:pointer}
.sb-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.35);transition:all .12s;position:relative}
.sb-ico:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8)}
.sb-ico.active{background:rgba(55,138,221,.25);color:#6ab0f5}
.sb-ico svg{width:18px;height:18px}
.sb-div{width:28px;height:1px;background:rgba(255,255,255,.07);margin:4px 0}
.sb-tip{position:absolute;left:46px;background:#1a2540;color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:100}
.sb-ico:hover .sb-tip{opacity:1}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:var(--w);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0}
.tb-title{font-size:16px;font-weight:700}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:7px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--rs);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd2);background:var(--w);color:var(--tx);transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btn-primary{background:var(--bl);color:#fff;border-color:var(--bl)}.btn-primary:hover{background:var(--bl-d)}
.btn-green{background:var(--gn-m);color:#fff;border-color:var(--gn-m)}.btn-green:hover{background:var(--gn)}
.btn-sm{padding:5px 10px;font-size:11px}

/* LAYOUT */
.layout{flex:1;display:flex;overflow:hidden}
.sidebar-nav{width:220px;background:var(--w);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sn-section{font-size:10px;font-weight:700;color:var(--hi);text-transform:uppercase;letter-spacing:.08em;padding:14px 16px 5px}
.sn-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;color:var(--mu);font-size:13px;font-weight:500;transition:all .12s;border-left:3px solid transparent}
.sn-item:hover{background:var(--s2);color:var(--tx)}
.sn-item.active{background:var(--bl-l);color:var(--bl-d);border-left-color:var(--bl);font-weight:600}
.sn-item svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.sn-item.active svg{opacity:1}
.sn-divider{height:1px;background:var(--bd);margin:6px 14px}
.sn-new{padding:12px 14px;margin-top:auto}

.content{flex:1;overflow-y:auto;padding:20px 22px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

/* PAGE */
.page{display:none}.page.active{display:block}

/* PERIOD */
.pp-row{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.pp{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd2);background:var(--w);color:var(--mu);transition:all .12s}
.pp:hover{background:var(--s2)}
.pp.active{background:var(--bl);color:#fff;border-color:var(--bl)}
.pp-custom{display:flex;align-items:center;gap:6px;margin-left:auto}
.pdiv{height:18px;width:1px;background:var(--bd);margin:0 4px}

/* KPI */
.kpi-row{display:grid;gap:10px;margin-bottom:16px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--w);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.bl::before{background:var(--bl)}.kpi.gn::before{background:var(--gn-m)}.kpi.rd::before{background:var(--rd-m)}.kpi.am::before{background:var(--am-m)}.kpi.pu::before{background:var(--pu-m)}.kpi.tl::before{background:var(--tl-m)}
.kpi-l{font-size:10px;color:var(--hi);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.kpi-v{font-size:20px;font-weight:800;line-height:1;margin-bottom:3px}
.kpi-s{font-size:11px;color:var(--mu)}
.d{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.d.up{background:var(--gn-l);color:var(--gn)}.d.dn{background:var(--rd-l);color:var(--rd)}.d.neu{background:var(--s2);color:var(--mu)}

/* CARD */
.card{background:var(--w);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.card-head{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.ct{font-size:13px;font-weight:700}
.ca{font-size:11px;color:var(--bl);cursor:pointer;font-weight:600}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.g13{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.g31{display:grid;grid-template-columns:1fr 1.5fr;gap:14px;margin-bottom:14px}
.gcol{display:flex;flex-direction:column;gap:14px}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:700;color:var(--hi);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:2px solid var(--bd);background:var(--s2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--bd);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f0f6ff}
.tr{text-align:right;font-variant-numeric:tabular-nums}
.tm{color:var(--mu)}
.tft td{background:var(--s2);font-weight:700;border-top:2px solid var(--bd)}

/* BADGE */
.b{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.b-green{background:var(--gn-l);color:var(--gn-d)}.b-red{background:var(--rd-l);color:var(--rd-d)}
.b-blue{background:var(--bl-l);color:var(--bl-d)}.b-amber{background:var(--am-l);color:var(--am-d)}
.b-purple{background:var(--pu-l);color:var(--pu-d)}.b-teal{background:var(--tl-l);color:var(--tl-d)}
.b-gray{background:var(--s2);color:var(--mu);border:1px solid var(--bd)}

/* CHART BARS */
.bar-chart{display:flex;align-items:flex-end;gap:0;height:120px;padding:0 4px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.bc:hover .bc-bar{opacity:.75}
.bc-stack{display:flex;flex-direction:column-reverse;gap:1px;align-items:center;width:100%}
.bc-bar{width:78%;border-radius:3px 3px 0 0;transition:opacity .12s}
.bc-lbl{font-size:9px;color:var(--hi);text-align:center}
.bc-val{font-size:9px;font-weight:700;color:var(--mu)}

/* LINE CHART (CSS) */
.line-chart{position:relative;height:120px;background:var(--s2);border-radius:var(--rs);overflow:hidden;margin-bottom:6px}
.lc-grid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0}
.lc-line{height:1px;background:rgba(255,255,255,.6);width:100%}
.lc-points{position:absolute;bottom:0;left:0;right:0;top:0;display:flex;align-items:flex-end;padding:4px 8px;gap:0}
.lc-point{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.lc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;position:relative;z-index:2}
.lc-bar{width:3px;border-radius:3px 3px 0 0;flex-shrink:0}

/* PNL / BS */
.pr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12px}
.pr:last-child{border-bottom:none}
.pt{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;font-weight:700;border-top:1px solid var(--bd);margin-top:2px}
.ps{font-size:10px;font-weight:700;color:var(--hi);text-transform:uppercase;letter-spacing:.07em;padding:10px 0 4px}
.pgrand{display:flex;justify-content:space-between;padding:10px 12px;font-size:14px;font-weight:800;border-radius:var(--rs);margin-top:6px}
.bs-head{font-size:10px;font-weight:700;color:var(--hi);text-transform:uppercase;letter-spacing:.06em;padding:7px 10px;background:var(--s2);border-radius:5px;margin-bottom:5px;margin-top:10px}
.bs-row{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--bd);font-size:12px}
.bs-row:last-child{border-bottom:none}
.bs-total{display:flex;justify-content:space-between;padding:7px 10px;font-weight:700;font-size:13px;background:var(--s2);border-radius:var(--rs);margin-top:5px}

/* WATERFALL */
.wf{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.wfl{font-size:11px;color:var(--mu);width:160px;flex-shrink:0;font-weight:500}
.wfw{flex:1;position:relative;height:20px;background:var(--s2);border-radius:4px;overflow:hidden}
.wfb{position:absolute;top:0;height:100%;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:700;white-space:nowrap}
.wfamt{font-size:11px;font-weight:700;width:90px;text-align:right;flex-shrink:0}

/* FUNNEL */
.fn-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.fn-lbl{font-size:11px;color:var(--mu);width:120px;flex-shrink:0}
.fn-wrap{flex:1;background:var(--s2);border-radius:4px;height:18px;overflow:hidden}
.fn-bar{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:700;transition:width .5s}
.fn-cnt{font-size:11px;font-weight:700;width:26px;text-align:right;flex-shrink:0}
.fn-pct{font-size:10px;color:var(--hi);width:36px;text-align:right;flex-shrink:0}

/* PROGRESS */
.prog-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prog-lbl{font-size:12px;font-weight:500;flex:1}
.prog-wrap{width:160px;background:var(--s2);border-radius:4px;height:7px;overflow:hidden;flex-shrink:0}
.prog-bar{height:100%;border-radius:4px;transition:width .4s}
.prog-val{font-size:12px;font-weight:700;width:80px;text-align:right;flex-shrink:0}

/* ALERT */
.alert{border-radius:var(--rs);padding:9px 13px;margin-bottom:12px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px}
.al-b{background:var(--bl-l);color:var(--bl-d);border:1px solid rgba(55,138,221,.2)}
.al-g{background:var(--gn-l);color:var(--gn-d);border:1px solid rgba(59,109,17,.2)}
.al-w{background:var(--am-l);color:var(--am-d);border:1px solid rgba(186,117,23,.2)}

/* METRIC CARD */
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.metric{background:var(--s2);border-radius:var(--rs);padding:12px 14px;border-left:3px solid var(--bl)}
.metric.gn{border-left-color:var(--gn-m)}.metric.rd{border-left-color:var(--rd-m)}.metric.am{border-left-color:var(--am-m)}.metric.pu{border-left-color:var(--pu-m)}
.metric-l{font-size:10px;color:var(--hi);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.metric-v{font-size:16px;font-weight:800}
.metric-s{font-size:10px;color:var(--mu);margin-top:2px}

/* COMPARE TABLE */
.compare td:nth-child(2){color:var(--gn-m);font-weight:600}
.compare td:nth-child(3){color:var(--bl);font-weight:600}
.compare td:nth-child(4){font-weight:700}
.up-cell{color:var(--gn-m)!important}.dn-cell{color:var(--rd-m)!important}

/* EMP KPI */
.emp-kpi-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.emp-kpi-row:last-child{border-bottom:none}
.ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.kpi-stats{display:flex;gap:14px;flex-shrink:0}
.ks{text-align:center}
.ksv{font-size:13px;font-weight:800}
.ksl{font-size:9px;color:var(--hi)}

/* модуль внутри оболочки: свой сайдбар и топбар не нужны */
body{display:block;height:auto;overflow:visible;background:var(--bg)}
.main{display:block}
.layout{display:flex;min-height:calc(100vh - 0px);align-items:stretch}
.sidebar-nav{position:sticky;top:0;align-self:flex-start;max-height:100vh}
.content{overflow:visible}

th.tc,td.tc{text-align:center}
th.tr,td.tr{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;font-weight:700;color:var(--hi);text-transform:uppercase;
   letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--s2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f1f4fa}
tbody tr:hover{background:#f8faff}


/* ══════════════════════════════════════════════════
   Адаптив и защита от обрезания.
   В исходных стилях не было ни одного медиазапроса,
   а ширины подписей стояли в 80–120 px — длинные суммы
   и названия не помещались.
   ══════════════════════════════════════════════════ */

/* элементы сетки не должны распирать контейнер */
.kpi-row > *, .g2 > *, .g3 > *, .g13 > *, .g31 > *, .acc-grid > *, .metric-grid > *{min-width:0}
.kpi-v{font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.kpi-l,.kpi-s{overflow-wrap:anywhere}

/* счета подстраиваются под ширину, а не по 4 в ряд всегда */
.acc-grid{grid-template-columns:repeat(auto-fit,minmax(208px,1fr))}

/* подписи и суммы в полосах: не режем длинные значения */
.prog-val{width:auto;min-width:120px;white-space:nowrap}
.prog-lbl{min-width:0;overflow-wrap:anywhere}
.prog-row{gap:10px}
.fn-lbl{width:auto;min-width:150px;max-width:210px}
.fn-cnt{white-space:nowrap}
.mut-bar{min-width:60px}
.pdiv{height:18px;width:1px;background:var(--bd);margin:0 4px}

/* строки отчётов: длинное название не наезжает на сумму */
.pr,.pt,.pgrand,.bs-row,.bs-total{gap:12px}
.pr > span:first-child,.bs-row > span:first-child{min-width:0;overflow-wrap:anywhere}
.pr > span:last-child,.pt > span:last-child,.pgrand > span:last-child,
.bs-row > span:last-child,.bs-total > span:last-child{white-space:nowrap;flex-shrink:0}

/* таблицы всегда с горизонтальной прокруткой, ничего не срезается */
.tw,.card > div[style*="overflow-x"]{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:620px}
.card{overflow:hidden}

@media (max-width:1400px){
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1180px){
  .g2,.g13,.g31{grid-template-columns:1fr}
  .g3,.metric-grid{grid-template-columns:repeat(2,1fr)}
  .k3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .k4,.k3,.k2,.g3,.metric-grid{grid-template-columns:1fr}
  .view,.content{padding:12px 12px 32px}
  .fn-lbl{min-width:110px}
  .prog-val{min-width:96px;font-size:11.5px}
}

/* боковое меню отчётов: прокручивается и не обрезает пункты */
.sidebar-nav{max-height:100vh;overflow-y:auto;overscroll-behavior:contain}
.sn-item{white-space:normal;line-height:1.35}

@media (max-width:900px){
  /* на узком экране меню превращается в горизонтальную ленту */
  .layout{flex-direction:column}
  .sidebar-nav{width:auto;max-height:none;position:static;flex-direction:row;
               overflow-x:auto;border-right:none;border-bottom:1px solid var(--bd);
               padding:6px 8px;gap:4px;align-items:center}
  .sn-section,.sn-divider{display:none}
  .sn-item{border-left:none;border-radius:20px;padding:7px 13px;white-space:nowrap;
           border:1px solid var(--bd)}
  .sn-item.active{border-color:var(--bl)}
}

/* контейнер строк рейтинга (дорожка называется .prog-wrap) */
.progs{padding:12px 16px}
.progs .prog-row:last-child{margin-bottom:0}
/* имя слева не сжимается в столбик, полоса тянется по остатку места */
.progs .prog-lbl{flex:0 1 190px;min-width:120px;overflow-wrap:normal}
.progs .prog-wrap{flex:1 1 auto;width:auto;min-width:80px}
.prog-wrap{width:100%;min-width:80px}
.prog-row{gap:10px}
.fn-lbl{width:170px}
.fn-cnt{width:44px}
.fn-pct{width:52px}
.bar-chart{align-items:flex-end;gap:8px}
.bc{justify-content:flex-end}
</style>
</head>
<body>

<div class="main"><div class="layout">
  <div class="sidebar-nav" id="nav"></div>
  <div class="content" id="content"></div>
</div></div>

<iframe id="printer" style="position:fixed;width:0;height:0;border:0;left:-9999px" title="Печать"></iframe>

<script>
/* сообщаем оболочке о сбое, чтобы он не превратился в пустой экран */
window.__errHook = true;
window.addEventListener('error', e => {
  try{ window.parent.postMessage({ ns:'kasymov', type:'moduleError',
       msg:(e.message||'') + ' · ' + (e.lineno||'') }, '*'); }catch(_){}
  const b = document.body;
  if(b) b.insertAdjacentHTML('afterbegin',
    '<div style="background:#7d211c;color:#fff;padding:12px 16px;font:13px/1.5 -apple-system,sans-serif">'
    + '<b>Сбой в разделе.</b> ' + (e.message||'') + '</div>');
});
</script>
<script>document.write('<script src="kasymov-data.js'+(location.search||'')+'"><\/script>');</script>
<script>
const K = window.KASYMOV;
let S = null, page = 'pnl';
let P = { preset:'month', from:'', to:'' };
const TODAY = '2026-08-03';
const MN = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const CLOSED = ['installed','paid','done'];

const NAV = [
  ['Финансовые отчёты', [
    ['pnl','Прибыль и убытки (ОПИУ)'], ['dds','Движение денег (ДДС)'], ['balance','Баланс'],
  ]],
  ['Продажи', [
    ['revenue','Выручка'], ['expenses','Расходы'], ['sales','Продажи по менеджерам'],
    ['funnel','Воронка продаж'], ['sources','Источники заявок'],
  ]],
  ['Производство', [
    ['prod','Выработка цеха'], ['prodtime','Сроки и загрузка цеха'],
  ]],
  ['Персонал', [
    ['employees','Работа сотрудников'], ['salary','Зарплатная ведомость'],
  ]],
  ['Склад', [ ['stock','Склад: остатки и ABC-анализ'] ]],

function range(p){ return p ? K.rangeOf(p) : K.rangeOf(P.preset, P.from, P.to); }
const pName = p => p ? K.rangeName(p) : K.rangeName(P.preset, P.from, P.to);
const ok = (d,f,t) => { const x = (d||'').slice(0,10); return x >= f && x <= t; };
const inR = d => { const [f,t] = range(); return ok(d,f,t); };
const staff = id => K.staffName(id);
const f0 = n => K.fmt(n);

function pl(p){
  const [f,t] = range(p);
  const ords = S.orders.filter(o => CLOSED.includes(o.status) && ok(o.deadline,f,t));
  const opts = S.docs.filter(d => d.type === 'opt' && ok(d.date,f,t));
  const revR = ords.reduce((a,o) => a + K.orderTotal(o), 0);
  const revO = opts.reduce((a,d) => a + d.lines.reduce((x,l) => x + l.qty * l.price, 0), 0);
  const cstR = ords.reduce((a,o) => a + K.orderCost(o, S.goods), 0);
  const cstO = opts.reduce((a,d) => a + d.lines.reduce((x,l) => {
    const g = S.goods.find(z => z.id === l.good); return x + l.qty * (g ? g.cost : 0); }, 0), 0);
  const exps = (S.expenses||[]).filter(e => ok(e.date,f,t) && e.cat !== 'Закуп материалов');
  const byCat = {}; exps.forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + e.sum);
  const expSum = exps.reduce((a,e) => a + e.sum, 0);
  const rev = revR + revO, cost = cstR + cstO;
  return { ords, opts, revR, revO, rev, cstR, cstO, cost, gross:rev - cost,
           byCat, expSum, profit:rev - cost - expSum };
}
const leads = p => { const [f,t] = range(p); return S.orders.filter(o => ok(o.created,f,t)); };

/* вспомогательный расчёт за произвольный отрезок */
function pl0(f,t){
  const ords = S.orders.filter(o => CLOSED.includes(o.status) && ok(o.deadline,f,t));
  const opts = S.docs.filter(d => d.type === 'opt' && ok(d.date,f,t));
  const rev = ords.reduce((a,o) => a + K.orderTotal(o), 0) +
    opts.reduce((a,d) => a + d.lines.reduce((x,l) => x + l.qty * l.price, 0), 0);
  const cost = ords.reduce((a,o) => a + K.orderCost(o, S.goods), 0) +
    opts.reduce((a,d) => a + d.lines.reduce((x,l) => {
      const g = S.goods.find(z => z.id === l.good); return x + l.qty * (g ? g.cost : 0); }, 0), 0);
  const exp = (S.expenses||[]).filter(e => ok(e.date,f,t) && e.cat !== 'Закуп материалов')
    .reduce((a,e) => a + e.sum, 0);
  return { rev, cost, exp, profit:rev - cost - exp };
}

PAGES.sales = () => {

  const mgr = K.byRole('manager').map(s => {
    const my = l.filter(o => o.manager === s.id);
    const meas = my.filter(o => o.status !== 'new');                 /* замер назначен */
    const went = my.filter(o => ORD(o.status) >= 2);                 /* вышли на замер */
    const won = my.filter(o => !['new','assigned','measured','thinking','rejected'].includes(o.status));
    const closed = p.ords.filter(o => o.manager === s.id);
    return { s, cnt:my.length, meas:meas.length, went:went.length, won:won.length, closed:closed.length,
             sum:closed.reduce((a,o) => a + K.orderTotal(o), 0) };

      <tbody>${mgr.length ? mgr.map(x => `<tr>
        <td><b>${K.esc(x.s.name)}</b></td>

    map[s].n++;
    if(!['new','assigned','measured','thinking','rejected'].includes(o.status)) map[s].won++;

PAGES.prod = () => {
  const [f,t] = range();
  /* сколько галочек поставлено за период, по операциям и людям */
  const byOp = {}, byMan = {};
  let totalTicks = 0;
  S.orders.forEach(o => o.items.forEach(it => (it.marks || []).forEach(m =>
    K.OPS.forEach(op => {
      const e = m[op.key];
      if(!e || !ok(e.at,f,t)) return;
      byOp[op.key] = (byOp[op.key] || 0) + 1;
      if(!byMan[e.by]) byMan[e.by] = { total:0, per:{} };
      byMan[e.by].total++; byMan[e.by].per[op.key] = (byMan[e.by].per[op.key] || 0) + 1;
      totalTicks++;
    }))));
  const men = Object.entries(byMan).sort((a,b) => b[1].total - a[1].total);
  const mxM = Math.max(1, ...men.map(m => m[1].total));
  const mxO = Math.max(1, ...K.OPS.map(o => byOp[o.key] || 0));

  /* выпуск: изделия, у которых упаковка закрыта в периоде */
  let made = 0, madeArea = 0;
  S.orders.forEach(o => o.items.forEach(it => (it.marks || []).forEach(m => {
    if(m.pack && ok(m.pack.at,f,t)){ made++; madeArea += it.w * it.h; }
  })));
  const inShop = S.orders.filter(o => o.status === 'toShop');
  const pcsInShop = inShop.reduce((a,o) => a + o.items.reduce((x,i) => x + i.qty, 0), 0);

  return `${ppRow()}
  <div class="al-b alert">ℹ Выработка цеха считается по галочкам, которые ставят рабочие в разделе «Производство».</div>
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi gn"><div class="kpi-l">Изготовлено изделий</div>
      <div class="kpi-v" style="color:var(--gn-m)">${made}</div>
      <div class="kpi-s">${K.qfmt(madeArea)} м² упаковано</div></div>
    <div class="kpi bl"><div class="kpi-l">Операций закрыто</div>
      <div class="kpi-v">${totalTicks}</div>
      <div class="kpi-s">${men.length} человек работали</div></div>
    <div class="kpi am"><div class="kpi-l">Сейчас в цеху</div>
      <div class="kpi-v" style="color:var(--am-m)">${pcsInShop}</div>
      <div class="kpi-s">изделий по ${inShop.length} адресам</div></div>
    <div class="kpi tl"><div class="kpi-l">На человека</div>
      <div class="kpi-v" style="color:var(--tl-m)">${men.length?Math.round(totalTicks/men.length):0}</div>
      <div class="kpi-s">операций за период</div></div>
  </div>

  <div class="g2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
    <div class="card"><div class="card-head"><div class="ct">Сколько операций закрыто по видам</div></div>
      <div class="progs">${K.OPS.map(op => `<div class="prog-row"><div class="prog-lbl">${op.label}</div><div class="prog-wrap"><div class="prog-bar" style="width:${Math.max(2,(byOp[op.key]||0)/mxO*100)}%;background:var(--bl)"></div></div><div class="prog-val">${byOp[op.key] || 0}</div></div>`).join('')}</div>
    </div>
    <div class="card"><div class="card-head"><div class="ct">Кто сколько сделал (операций за период)</div></div>
      <div class="progs">${men.length ? men.map(([id,v]) => `<div class="prog-row"><div class="prog-lbl">${K.esc(staff(id))}</div><div class="prog-wrap"><div class="prog-bar" style="width:${Math.max(2,v.total/mxM*100)}%;background:var(--gn-m)"></div></div><div class="prog-val">${v.total} оп.</div></div>`).join('')
        : '<div style="color:var(--hi);font-size:12px;padding:10px 0">За период отметок нет</div>'}</div>
    </div>
  </div>

  <div class="card"><div class="card-head"><div class="ct">Выработка по людям и операциям</div>
    <div class="ca">${pName()}</div></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Сотрудник</th>
        ${K.OPS.map(o => `<th class="tc" style="width:95px">${o.label}</th>`).join('')}
        <th class="tc" style="width:100px">Всего</th></tr></thead>

PAGES.prodtime = () => {
  const inShop = S.orders.filter(o => o.status === 'toShop');
  const before = K.OPS.filter(o => o.key !== 'pack').map(o => o.key);
  const ready = m => before.every(k => m[k]);
  const rows = inShop.map(o => {
    const pcs = o.items.reduce((a,i) => a + i.qty, 0);
    const done = o.items.reduce((a,i) => a + i.marks.filter(ready).length, 0);
    const packed = o.items.reduce((a,i) => a + i.marks.filter(m => m.pack).length, 0);
    const left = Math.round((new Date(o.deadline) - new Date(TODAY)) / 864e5);
    return { o, pcs, done, packed, left, urgent:o.items.some(i => i.urgent) };
  }).sort((a,b) => a.left - b.left);

  /* сколько дней проходит от отправки в цех до упаковки */
  const cyc = [];
  S.orders.forEach(o => {
    const shop = (o.history||[]).find(h => h.what.includes('цех'));
    const pk = o.items.flatMap(i => i.marks || []).filter(m => m.pack).map(m => m.pack.at).sort()[0];
    if(shop && pk) cyc.push((new Date(pk.slice(0,10)) - new Date(shop.at.slice(0,10))) / 864e5);
  });
  const avgCyc = cyc.length ? (cyc.reduce((a,x) => a + x, 0) / cyc.length).toFixed(1) : '—';
  const late = rows.filter(r => r.left < 0).length;

  return `<div class="alert ${late?'al-w':'al-g'}">${late
    ? `⚠ ${late} заказов в цеху уже просрочены по сроку сдачи.`
    : '✓ Все заказы в цеху идут в срок.'}</div>
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi bl"><div class="kpi-l">Заказов в цеху</div><div class="kpi-v">${inShop.length}</div>
      <div class="kpi-s">${rows.reduce((a,r) => a + r.pcs, 0)} изделий</div></div>

      <div class="kpi-v" style="color:var(--gn-m)">${rows.reduce((a,r) => a + r.done, 0)}</div>
      <div class="kpi-s">изделий закрыто по 4 операциям</div></div>
    <div class="kpi am"><div class="kpi-l">Средний срок в цеху</div>
      <div class="kpi-v" style="color:var(--am-m)">${avgCyc} дн.</div>
      <div class="kpi-s">от отправки до упаковки</div></div>
    <div class="kpi ${late?'rd':'gn'}"><div class="kpi-l">Просрочено</div>
      <div class="kpi-v" style="color:var(--${late?'rd':'gn'}-m)">${late}</div>
      <div class="kpi-s">заказов</div></div>
  </div>
  <div class="card"><div class="card-head"><div class="ct">Что сейчас в цеху</div>
    <div class="ca">${inShop.length} адресов</div></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th style="width:80px">Заказ</th><th>Адрес</th>
        <th class="tc" style="width:90px">Изделий</th><th class="tc" style="width:110px">Готово</th>
        <th class="tc" style="width:110px">Упаковано</th><th style="width:180px">Прогресс</th>
        <th style="width:110px">Срок</th><th class="tc" style="width:110px">Осталось</th></tr></thead>
      <tbody>${rows.length ? rows.map(r => `<tr>
        <td style="font-weight:700">#${r.o.num}${r.urgent?' <span class="b b-gray">срочно</span>':''}</td>
        <td>${K.esc(r.o.addr)}</td>
        <td class="tc">${r.pcs}</td>

        <td class="tc">${r.packed}</td>
        <td><div class="prog-wrap" style="width:100%"><div class="prog-bar" style="width:${Math.max(3,r.done/r.pcs*100)}%;background:${r.done===r.pcs?'var(--gn-m)':'var(--bl)'}"></div></div></td>

PAGES.stock = () => {
  const l = leads();
  const use = {};
  l.forEach(o => o.items.forEach(i => {
    const a = i.w * i.h * i.qty;
    if(!use[i.fabric]) use[i.fabric] = { m2:0, rev:0 };
    use[i.fabric].m2 += a;
    if(CLOSED.includes(o.status)) use[i.fabric].rev += K.orderTotal(o) * (a /
      Math.max(0.01, o.items.reduce((x,z) => x + z.w * z.h * z.qty, 0)));
  }));
  const list = Object.entries(use).sort((a,b) => b[1].rev - a[1].rev);
  const tot = list.reduce((a,x) => a + x[1].rev, 0) || 1;
  let acc = 0;
  const abc = list.map(([n,v]) => { acc += v.rev;
    return { n, ...v, cls: acc/tot <= .8 ? 'A' : acc/tot <= .95 ? 'B' : 'C' }; });
  const mx = Math.max(1, ...abc.map(x => x.rev));
  const stockSum = S.goods.reduce((a,g) => a + K.total(g) * g.cost, 0);
  const zero = S.goods.filter(g => K.total(g) <= 0);
  const dead = S.goods.filter(g => K.total(g) > 0 && !use[g.name])
    .sort((a,b) => K.total(b) * b.cost - K.total(a) * a.cost).slice(0, 10);

  return `${ppRow()}
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi bl"><div class="kpi-l">Стоимость запаса</div>
      <div class="kpi-v">${f0(stockSum)} сом</div><div class="kpi-s">${S.goods.length} позиций</div></div>
    <div class="kpi rd"><div class="kpi-l">Нулевой остаток</div>
      <div class="kpi-v" style="color:var(--rd-m)">${zero.length}</div>
      <div class="kpi-s">нельзя запустить в работу</div></div>
    <div class="kpi am"><div class="kpi-l">Заморожено в неходовых</div>
      <div class="kpi-v" style="color:var(--am-m)">${f0(dead.reduce((a,g) => a + K.total(g) * g.cost, 0))} сом</div>
      <div class="kpi-s">${dead.length} позиций без движения</div></div>
    <div class="kpi gn"><div class="kpi-l">Группа A</div>
      <div class="kpi-v" style="color:var(--gn-m)">${abc.filter(x => x.cls==='A').length}</div>
      <div class="kpi-s">тканей дают 80% выручки</div></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><div class="ct">ABC-анализ тканей (какие ткани приносят выручку)</div><div class="ca">${pName()}</div></div>
    <div class="progs">${abc.length ? abc.map(x => `<div class="prog-row"><div class="prog-lbl"><span class="b b-${x.cls==='A'?'green':x.cls==='B'?'blue':'gray'}">${x.cls}</span>
        ${K.esc(x.n)}</div><div class="prog-wrap"><div class="prog-bar" style="width:${Math.max(2,x.rev/mx*100)}%;background:var(--bl)"></div></div><div class="prog-val">${f0(x.rev)} · ${K.qfmt(x.m2)} м²</div></div>`).join('')
      : '<div style="color:var(--hi);font-size:12px;padding:10px 0">За период заказов не было</div>'}</div>
    <div style="padding:0 16px 12px;font-size:11px;color:var(--hi)">
      A — дают 80% выручки, держите на складе всегда. B — следующие 15%. C — возите под заказ.</div>
  </div>
  <div class="card"><div class="card-head"><div class="ct">Лежит без движения</div>
    <div class="ca">${dead.length} позиций</div></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Товар</th><th style="width:150px">Категория</th>
        <th class="tr" style="width:110px">Остаток</th><th class="tr" style="width:100px">Себест.</th>
        <th class="tr" style="width:120px">Заморожено</th></tr></thead>
      <tbody>${dead.length ? dead.map(g => `<tr><td><b>${K.esc(g.name)}</b></td>
        <td>${g.cat}</td><td class="tr">${K.qfmt(K.total(g))} ${g.unit}</td>
        <td class="tr" style="color:var(--mu)">${f0(g.cost)}</td>
        <td class="tr" style="font-weight:700">${f0(K.total(g)*g.cost)}</td></tr>`).join('')
        : '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--hi)">Всё в обороте</td></tr>'}</tbody>
    </table></div></div>`;
};
