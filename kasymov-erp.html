<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMzQgMTc2IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9Ikthc3ltb3YiPgogIDxwYXRoIGQ9Ik0zMCAwICAgSDk5IFY1MyAgSDAgWiIgZmlsbD0iIzQ1OTlkNSIvPgogIDxwYXRoIGQ9Ik0zMCA2MSAgSDk5IFYxMTUgSDAgWiIgZmlsbD0iIzMwNzBhZSIvPgogIDxwYXRoIGQ9Ik0zMCAxMjIgSDk5IFYxNzUgSDAgWiIgZmlsbD0iIzE2M2E4NCIvPgogIDxwYXRoIGQ9Ik0xNzUgMCBIMjMzIEwxNTkgODggTDIzMyAxNzUgSDE3NCBMMTE1IDEwNSBWNzAgWiIgZmlsbD0iIzMzNmNhZiIvPgo8L3N2Zz4K">
<title>Kasymov ERP — Система управления</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1523;--bg2:#111827;--bd:rgba(255,255,255,.07);
  --bl:#378add;--bl-l:#e6f1fb;--bl-d:#0c447c;
  --gn:#639922;--rd:#e24b4a;--am:#ba7517;
  --tx:#fff;--mu:rgba(255,255,255,.55);--hi:rgba(255,255,255,.25);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── SPLASH ─────────────────────────────── */
#splash{
  position:fixed;inset:0;background:var(--bg);z-index:1000;transition:opacity .4s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{
  width:66px;height:66px;background:var(--bl);border-radius:17px;
  display:flex;align-items:center;justify-content:center;
  font-size:29px;font-weight:900;color:#fff;margin-bottom:18px;
  box-shadow:0 0 40px rgba(55,138,221,.4);
}
.splash-title{font-size:26px;font-weight:800;color:#fff;margin-bottom:5px}
.splash-sub{font-size:13px;color:var(--mu);margin-bottom:34px}
.splash-bar-wrap{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.splash-bar{height:100%;background:var(--bl);border-radius:4px;width:0;transition:width .1s linear}
.splash-hint{font-size:12px;color:var(--hi);margin-top:13px}

/* ── SHELL ──────────────────────────────── */
#shell{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sb-wrap{position:relative;display:flex;flex-shrink:0}

/* ── SIDEBAR ────────────────────────────── */
.sb{
  width:222px;background:var(--bg2);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;transition:width .2s;overflow:hidden;
background:var(--bg2)}
.sb.collapsed{width:58px}
.sb-logo{
  padding:15px 14px 13px;display:flex;align-items:center;gap:10px;width:100%;
  border-bottom:1px solid var(--bd);flex-shrink:0;text-align:left;
}
.sb-logo:hover{background:rgba(255,255,255,.04)}
.sb-mark{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:9px;background:#fff;flex-shrink:0;padding:6px 5px;
  box-shadow:0 2px 8px rgba(0,0,0,.25)}
.sb-mark svg{width:100%;height:100%;display:block}
.sb-mark{
  width:32px;height:32px;background:var(--bl);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:14px;color:#fff;flex-shrink:0;
}
.sb-brand{font-size:14px;font-weight:700;color:#fff;white-space:nowrap}
.sb-brand-sub{font-size:9px;color:var(--hi);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.collapsed .sb-txt{display:none}
.sb-nav{padding:8px;flex:1;overflow-y:auto;overflow-x:hidden}
.sb-section{
  font-size:9px;font-weight:700;color:var(--hi);text-transform:uppercase;
  letter-spacing:.1em;padding:12px 8px 4px;white-space:nowrap;overflow:hidden;
}
.collapsed .sb-section{height:0;padding:0;opacity:0}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border-radius:7px;
  color:var(--mu);font-size:13px;font-weight:500;
  transition:background .12s,color .12s;margin-bottom:1px;white-space:nowrap;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(55,138,221,.2);color:#6ab0f5}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.collapsed .nav-item .label{display:none}
.nav-item .badge{
  margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;flex-shrink:0;
}
.collapsed .nav-item .badge{display:none}
.sb-divider{height:1px;background:var(--bd);margin:6px 8px}
.sb-bottom{padding:9px 8px;border-top:1px solid var(--bd);flex-shrink:0}
.sb-ver{font-size:10px;color:rgba(255,255,255,.32);padding:0 10px 8px;letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
.sb.collapsed .sb-ver{display:none}
.sb-user{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;width:100%;text-align:left}
.sb-user:hover{background:rgba(255,255,255,.05)}
.sb-ava{
  width:28px;height:28px;border-radius:50%;background:var(--bl);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;
}
.sb-uname{font-size:12px;color:#fff;font-weight:600;white-space:nowrap}
.sb-urole{font-size:10px;color:var(--hi);white-space:nowrap}
.sb-toggle{
  position:absolute;right:-11px;top:64px;width:22px;height:22px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--mu);z-index:10;transition:.15s;
}
.sb-toggle:hover{background:var(--bl);color:#fff;border-color:var(--bl)}

/* ── MAIN ───────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:52px;background:#fff;border-bottom:1px solid #e4e8f0;
  display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.tb-crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:#9fa6c0;min-width:0}
.tb-ver{font-size:10px;font-weight:700;color:#b9c3d8;background:#eef1f7;
  border-radius:20px;padding:2px 8px;margin-left:9px;vertical-align:2px}
.tb-page{font-size:15px;font-weight:700;color:#1a1f36;white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-btn{
  display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;
  font-size:12px;font-weight:600;border:1px solid #cdd4e8;background:#fff;color:#1a1f36;
  transition:.12s;white-space:nowrap;
}
.tb-btn:hover{background:#f5f7fb}
.tb-btn.green{background:#639922;color:#fff;border-color:#639922}
.tb-btn.green:hover{background:#3b6d11;border-color:#3b6d11}
.tb-notif{
  width:32px;height:32px;border-radius:7px;border:1px solid #e4e8f0;background:#fff;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.tb-notif:hover{background:#f5f7fb}
.notif-dot{width:7px;height:7px;background:var(--rd);border-radius:50%;position:absolute;top:5px;right:5px}
.tb-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--bl);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;
}

/* ── CONTENT ────────────────────────────── */
.content-area{flex:1;overflow:hidden;position:relative}
.view{height:100%;overflow-y:auto;padding:22px;background:#f0f3fa}
.view[hidden]{display:none}

.home-greeting{font-size:21px;font-weight:800;color:#1a1f36;margin-bottom:3px}
.home-date{font-size:13px;color:#9fa6c0;margin-bottom:20px}
.home-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:22px}
.hk{
  background:#fff;border:1px solid #e4e8f0;border-radius:10px;padding:15px 17px;
  position:relative;overflow:hidden;transition:.15s;text-align:left;width:100%;
}
.hk:hover{border-color:#cdd4e8;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.hk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.hk.bl::before{background:var(--bl)}.hk.gn::before{background:var(--gn)}
.hk.rd::before{background:var(--rd)}.hk.am::before{background:var(--am)}
.hk-label{font-size:10px;color:#9fa6c0;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.hk-val{font-size:21px;font-weight:800;color:#1a1f36;line-height:1;margin-bottom:3px}
.hk-sub{font-size:11px;color:#5c6380}
.hk-delta{display:inline-flex;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-right:4px}
.up{background:#eaf3de;color:#3b6d11}.dn{background:#fcebeb;color:#a32d2d}

.sec-t{font-size:13px;font-weight:700;color:#1a1f36;margin-bottom:9px}
.alert-item{
  background:#fff;border:1px solid #e4e8f0;border-radius:10px;padding:11px 15px;
  margin-bottom:7px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;transition:.12s;
}
.alert-item:hover{border-color:#cdd4e8;background:#fafbff}
.alert-icon{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.alert-title{font-size:13px;font-weight:600;color:#1a1f36}
.alert-sub{font-size:11px;color:#9fa6c0;margin-top:1px}
.alert-arrow{margin-left:auto;font-size:16px;color:#cdd4e8}

.home-modules{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}
.module-card{
  background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:18px 20px;
  transition:.15s;display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;
}
.module-card:hover{border-color:var(--bl);box-shadow:0 4px 16px rgba(55,138,221,.12);transform:translateY(-2px)}
.mc-icon{
  width:42px;height:42px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.mc-icon svg{width:20px;height:20px}
.mc-title{font-size:14px;font-weight:700;color:#1a1f36;margin-bottom:3px}
.mc-sub{font-size:12px;color:#9fa6c0;line-height:1.45}
.mc-badge{display:inline-flex;margin-top:8px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}

.note{background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:15px 19px;margin-bottom:20px}
.note-t{font-size:13px;font-weight:700;color:#1a1f36;margin-bottom:4px}
.note-b{font-size:12px;color:#5c6380;line-height:1.7}
.note-b a{color:var(--bl);font-weight:600}

/* ── GUIDE ──────────────────────────────── */
.guide-card{background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:20px 22px;margin-bottom:14px}
.guide-title{font-size:16px;font-weight:700;color:#1a1f36;margin-bottom:14px}
.guide-step{display:flex;gap:13px;margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid #f0f3fa}
.guide-step:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.step-num{
  width:26px;height:26px;border-radius:50%;background:var(--bl);flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;
}
.step-title{font-size:13px;font-weight:700;color:#1a1f36;margin-bottom:3px}
.step-desc{font-size:12px;color:#5c6380;line-height:1.6}
.step-note{font-size:11px;color:#8a5410;background:#faeeda;border-radius:5px;padding:5px 9px;display:inline-block;margin-top:6px;font-weight:600}
.step-good{font-size:11px;color:#3b6d11;background:#eaf3de;border-radius:5px;padding:5px 9px;display:inline-block;margin-top:6px;font-weight:600}

/* ── IFRAME ─────────────────────────────── */
#frame-view{height:100%;position:relative}
#frame-view[hidden]{display:none}
#main-frame{width:100%;height:100%;border:none;display:block;background:#f0f3fa}
.frame-loading{
  position:absolute;inset:0;background:#f0f3fa;z-index:5;transition:opacity .3s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.frame-loading.hide{opacity:0;pointer-events:none}
.fl-spinner{
  width:34px;height:34px;border:3px solid #e4e8f0;border-top-color:var(--bl);
  border-radius:50%;animation:spin .7s linear infinite;margin-bottom:11px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.fl-text{font-size:13px;color:#9fa6c0;font-weight:500}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cdd4e8;border-radius:8px}

@media (max-width:1000px){
  .home-kpi{grid-template-columns:repeat(2,1fr)}
  .home-modules{grid-template-columns:1fr}
}
@media (max-width:700px){
  .sb{width:58px}.sb .sb-txt,.sb .label,.sb .badge{display:none}
  .sb-section{height:0;padding:0;opacity:0}
  .sb-toggle{display:none}
  .home-kpi{grid-template-columns:1fr}
  .tb-btn span.tb-lbl{display:none}
  .view{padding:14px 12px}
}

/* стили экрана входа удалены — вход отключён */
#err-box{position:fixed;left:0;right:0;bottom:0;z-index:999;background:#7d211c;color:#fff;
  padding:12px 18px;font-size:13px;line-height:1.5;box-shadow:0 -4px 20px rgba(0,0,0,.35)}
#err-box[hidden]{display:none}

/* ── экран входа ── */
#login{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(150deg,#0d1523 0%,#16233a 55%,#1d3352 100%)}
#login::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(233,223,201,.05) 0 2px,transparent 2px 10px)}
#login[hidden]{display:none}
#login-box{position:relative;z-index:1;width:330px;background:#fff;border-radius:16px;
  padding:26px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.lg-logo{text-align:center;margin-bottom:14px}
.lg-mark{display:inline-block;width:52px;height:52px;border-radius:13px;background:#16233a;
  background-image:url('kasymov-logo.jpg');background-size:contain;background-repeat:no-repeat;
  background-position:center}
.lg-t{font-size:19px;font-weight:800;text-align:center;color:#16203a}
.lg-s{font-size:12.5px;color:#7b849d;text-align:center;margin:3px 0 4px}
.lg-v{font-size:10.5px;color:#aab3ca;text-align:center;margin-bottom:18px}
.lg-f{display:block;margin-bottom:12px}
.lg-f span{display:block;font-size:11px;font-weight:700;color:#5c6380;margin-bottom:5px}
.lg-f input{width:100%;padding:10px 12px;border:1px solid #cdd4e8;border-radius:9px;
  font-family:inherit;font-size:14px;color:#16203a}
.lg-f input:focus{outline:none;border-color:#378add;box-shadow:0 0 0 3px rgba(55,138,221,.16)}
.lg-err{font-size:12px;color:#c0392b;min-height:17px;margin-bottom:6px;font-weight:600}
.lg-btn{width:100%;padding:11px;border:none;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#4a95e4,#1c62b4);color:#fff;font-family:inherit;
  font-size:14.5px;font-weight:700}
.lg-btn:hover{background:linear-gradient(180deg,#5aa0e9,#1a5aa8)}
#shell[hidden]{display:none!important}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">K</div>
  <div class="splash-title">Kasymov ERP</div>
  <div class="splash-sub">Система управления компанией</div>
  <div class="splash-bar-wrap"><div class="splash-bar" id="splash-bar"></div></div>
  <div class="splash-hint" id="splash-hint">Загрузка модулей…</div>
</div>

<div id="login">
  <form id="login-box" autocomplete="on">
    <div class="lg-logo"><span class="lg-mark"></span></div>
    <div class="lg-t">Kasymov ERP</div>
    <div class="lg-s">Вход в систему</div>
    <div class="lg-v">сборка 10.0 · с защитой входа</div>
    <label class="lg-f"><span>Логин</span>
      <input id="lg-user" autocomplete="username" autofocus spellcheck="false"></label>
    <label class="lg-f"><span>Пароль</span>
      <input id="lg-pass" type="password" autocomplete="current-password"></label>
    <div class="lg-err" id="lg-err"></div>
    <button class="lg-btn" type="submit">Войти</button>
  </form>
</div>

<div id="shell" hidden>
  <div class="sb-wrap">
    <aside class="sb" id="sidebar">
      <button class="sb-logo" onclick="go('dashboard')">
        <span class="sb-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 234 176" role="img" aria-label="Kasymov"> <path d="M30 0  H99 V53 H0 Z" fill="#4599d5"/> <path d="M30 61 H99 V115 H0 Z" fill="#3070ae"/> <path d="M30 122 H99 V175 H0 Z" fill="#163a84"/> <path d="M175 0 H233 L159 88 L233 175 H174 L115 105 V70 Z" fill="#336caf"/></svg></span>
        <span class="sb-txt">
          <span class="sb-brand" style="display:block">Kasymov</span>
          <span class="sb-brand-sub" style="display:block">ERP система</span>
        </span>
      </button>

      <nav class="sb-nav">
        <div class="sb-section">Показатели</div>
        <button class="nav-item active" id="nav-dashboard" onclick="go('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18"/><rect x="5" y="11" width="3.6" height="9" rx="1"/><rect x="10.2" y="6" width="3.6" height="14" rx="1"/><rect x="15.4" y="14" width="3.6" height="6" rx="1"/></svg>
          <span class="label">Показатели</span>
          <span class="badge" id="bdg-dashboard"></span>
        </button>


        <div class="sb-divider"></div>
        <div class="sb-section">Продажи</div>
        <button class="nav-item" id="nav-orders" onclick="go('orders')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          <span class="label">Заказы</span>
          <span class="badge" id="bdg-orders"></span>
        </button>

        <button class="nav-item" id="nav-partners" onclick="go('partners')">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>

          <span class="label">Партнёры</span>

          <span class="badge" id="bdg-partners"></span>

        </button>

        <div class="sb-divider"></div>
        <div class="sb-section">Производство</div>
        <button class="nav-item" id="nav-production" onclick="go('production')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V9l5 3V9l5 3V7l4 2v12"/><path d="M9 21v-4h4v4"/></svg>
          <span class="label">Производство</span>
          <span class="badge" id="bdg-production"></span>
        </button>
        <button class="nav-item" id="nav-warehouse" onclick="go('warehouse')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
          <span class="label">Склад</span>
          <span class="badge" id="bdg-warehouse"></span>
        </button>

        <button class="nav-item" id="nav-wholesale" onclick="go('wholesale')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 11.2a2 2 0 002 1.6h7.7a2 2 0 002-1.6L21 7H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
          <span class="label">Опт</span>

<!-- подключение к базе: библиотека, данные, адаптер -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="kasymov-data.js"></script>
<script src="kasymov-supabase.js"></script>
<script>
const K = window.KASYMOV;
/* без файла данных работать нечего — объясняем это сразу и понятно */
if(!K){
  document.addEventListener('DOMContentLoaded', () => {
    document.body.innerHTML =
      '<div style="max-width:560px;margin:14vh auto;font:15px/1.6 -apple-system,BlinkMacSystemFont,'
      + '\'Segoe UI\',sans-serif;color:#1a1f36;background:#fff;padding:28px 30px;border-radius:14px;'
      + 'box-shadow:0 10px 40px rgba(0,0,0,.12)">'
      + '<div style="font-size:19px;font-weight:800;margin-bottom:10px">Не найден файл данных</div>'
      + 'Рядом с <b>kasymov-main.html</b> должен лежать <b>kasymov-data.js</b> и остальные файлы —'
      + ' все в одной папке.<div style="margin-top:14px;padding-top:14px;border-top:1px solid #e4e8f0;'
      + 'font-size:14px;color:#5c6380">Проще всего открыть <b>kasymov-erp.html</b> — там всё внутри'
      + ' одного файла, ничего рядом класть не нужно.</div></div>';
    document.body.style.background = '#f0f3fa';
  });
  throw new Error('kasymov-data.js не загрузился');
}

/* ══ ОБЩЕЕ СОСТОЯНИЕ ══════════════════════════════
   Оболочка — владелец данных. Модуль в iframe просит
   состояние ('ready'), меняет его и присылает обратно
   ('commit'). Поэтому цифры везде совпадают.        */
/* ── показываем ошибки прямо на странице ──
   Раньше сбой скрипта оставлял белый экран без объяснений. */
let ERR_FIRST = null, ERR_N = 0;
window.addEventListener('error', e => {
  ERR_N++;
  if(!ERR_FIRST) ERR_FIRST = { m:e.message || 'неизвестная ошибка',
                               f:(e.filename || '').split('/').pop(), l:e.lineno };
  const box = document.getElementById('err-box');
  if(!box) return;
  box.hidden = false;
  /* показываем ПЕРВУЮ ошибку: остальные обычно её следствие */
  box.innerHTML = '<b>Сбой в системе.</b> ' + ERR_FIRST.m +
    '<div style="font-size:11px;opacity:.75;margin-top:4px">' + ERR_FIRST.f +
    (ERR_FIRST.l ? ', строка ' + ERR_FIRST.l : '') +
    (ERR_N > 1 ? ' · дальше ещё ' + (ERR_N - 1) + ' ошибок, они следствие первой' : '') +
    ' · покажите это сообщение разработчику</div>';
});

let STATE = K.clone(K.seed);

/* ═══ БАЗА ДАННЫХ ═══
   Если подключён kasymov-supabase.js — берём данные из базы,
   иначе работаем на демо-данных в памяти, как сейчас. */
async function initDB(){
  if(!window.KasymovDB) return;
  try{
    const loaded = await window.KasymovDB.init();
    if(!loaded) return;               // база не готова — остаёмся на демо-данных
    STATE = loaded;
    /* обновляем счётчики, если такая функция есть */
    if(typeof refreshBadges === 'function') refreshBadges();
    else if(typeof counts === 'function') counts();
    const f = document.getElementById('main-frame');
    if(f && f.contentWindow) f.contentWindow.postMessage(
      { ns:'kasymov', type:'state', state:Object.assign(K.clone(STATE), { me:ME }) }, '*');
    console.log('Данные загружены из базы');
  }catch(e){
    console.error('База недоступна, работаем на демо-данных:', e.message);
  }
}
initDB();
let ME = null;   /* кто вошёл */

/* ═══ ВХОД ═══ */
(function(){
  const box = document.getElementById('login-box');
  const err = document.getElementById('lg-err');
  if(!box) return;

  /* если уже входили на этом устройстве — не спрашиваем снова */
  try{
    const s = JSON.parse(sessionStorage.getItem('kasymov-me') || 'null');
    if(s && K.STAFF.some(x => x.id === s.id)) return enter(K.STAFF.find(x => x.id === s.id));
  }catch(_){}

  box.addEventListener('submit', e => {
    e.preventDefault();
    const person = K.auth(document.getElementById('lg-user').value,
                          document.getElementById('lg-pass').value);
    if(!person){
      err.textContent = 'Неверный логин или пароль';
      document.getElementById('lg-pass').value = '';
      document.getElementById('lg-pass').focus();
      return;
    }
    try{ sessionStorage.setItem('kasymov-me', JSON.stringify({ id:person.id })); }catch(_){}
    enter(person);
  });

  function enter(person){
    ME = person;
    STATE.me = person;
    document.getElementById('login').hidden = true;
    document.getElementById('shell').hidden = false;
    applyAccess();
    const first = (K.ACCESS[person.role] || ['dashboard'])[0];
    go(first);
  }
})();

/* показываем только разрешённые роли разделы */
function applyAccess(){
  if(!ME) return;
  const allowed = K.ACCESS[ME.role] || [];
  document.querySelectorAll('.nav-item[onclick]').forEach(b => {
    const m = /go\('([a-z]+)'\)/.exec(b.getAttribute('onclick'));
    if(m) b.style.display = allowed.includes(m[1]) ? '' : 'none';
  });
  document.querySelectorAll('.sb-section, .sb-divider').forEach(el => {
    /* прячем заголовок группы, если в ней не осталось видимых пунктов */
    let n = el.nextElementSibling, has = false;
    while(n && !n.classList.contains('sb-section') && !n.classList.contains('sb-divider')){
      if(n.classList.contains('nav-item') && n.style.display !== 'none') has = true;
      n = n.nextElementSibling;
    }
    el.style.display = has ? '' : 'none';
  });
  const av = document.querySelector('.sb-user .label') || document.querySelector('.sb-user');
  if(av) av.textContent = ME.name;
}
let page = 'home';

/* ── SPLASH ─────────────────────────────────────── */
(function(){
  const bar = document.getElementById('splash-bar');
  const hint = document.getElementById('splash-hint');
  const msgs = ['Заказы…','Производство…','Склад…','Готово'];
  let w = 0, i = 0;
  const t = setInterval(() => {
    w += 5;
    bar.style.width = w + '%';
    if(w % 25 === 0 && i < msgs.length) hint.textContent = msgs[i++];
    if(w >= 100){ clearInterval(t); setTimeout(done, 250); }
  }, 35);
  const sp = document.getElementById('splash');
  function done(){ if(sp) sp.classList.add('hide'); }
  if(sp) sp.addEventListener('click', () => { clearInterval(t); done(); });
})();

/* блок даты убран вместе со страницей «Главная» */

/* ── навигация ──────────────────────────────────── */
const MODULES = {
  dashboard:  { title:'Показатели',   file:'kasymov-dashboard.html', action:'↓ Excel' },
  partners:   { title:'Партнёры',     file:'kasymov-partners.html', action:'+ Заказ партнёра' },
  orders:     { title:'Заказы',       file:'kasymov-orders.html',     action:'+ Новый заказ' },
  production: { title:'Производство', file:'kasymov-production.html', action:'Печать листа' },
  warehouse:  { title:'Склад',        file:'kasymov-warehouse.html',  action:'+ Оприходование' },
  wholesale:  { title:'Оптовые продажи', file:'kasymov-wholesale.html', action:'+ Продажа' },
  invoices:   { title:'Счета-фактуры',   file:'kasymov-invoices.html',  action:'+ Счёт вручную' },
  finance:    { title:'Финансы',      file:'kasymov-finance.html', action:'+ Расход' },
  reports:    { title:'Отчёты',       file:'kasymov-reports.html', action:'Печать отчёта' },
};

function go(p){
  /* страницы «Главная» и «Инструкция» удалены — старые ссылки
     и сохранённый в адресе #home ведут на «Показатели» */
  if(typeof MODULES === 'undefined' || !MODULES){
    console.warn('Список разделов ещё не готов');
    return;
  }
  if(!MODULES[p]) p = 'dashboard';
  if(ME && !(K.ACCESS[ME.role] || []).includes(p)){
    alert('У роли «' + K.ROLES[ME.role].label + '» нет доступа к этому разделу');
    return;
  }
  page = p;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const nav = document.getElementById('nav-' + p);
  if(nav) nav.classList.add('active');

  const isModule = !!MODULES[p];
  document.getElementById('frame-view').hidden = !isModule;

  const title = (MODULES[p] || MODULES.dashboard).title;
  document.getElementById('tb-page').textContent = title;
  document.getElementById('action-btn').textContent =
    isModule ? (MODULES[p].action || 'Модуль в разработке') : '+ Новый заказ';
  document.getElementById('action-btn').disabled = isModule && !MODULES[p].file;

  loadModule(p);
  /* при открытии файла с диска Safari запрещает менять адрес —
     ошибка здесь не должна мешать разделу открыться */
  try{ if(location.hash !== '#' + p) history.replaceState(null, '', '#' + p); }
  catch(e){ /* адрес просто не обновится, это не мешает работе */ }
}

function loadModule(p){
  const m = MODULES[p];
  const frame = document.getElementById('main-frame');
  const loading = document.getElementById('frame-loading');

  if(!m.file){
    loading.classList.add('hide');
    frame.srcdoc = `<style>body{margin:0;font-family:-apple-system,'Segoe UI',sans-serif;background:#f0f3fa;
      display:flex;align-items:center;justify-content:center;height:100vh}
      .b{text-align:center;max-width:400px;padding:30px}
      h1{font-size:16px;color:#1a1f36;margin:0 0 8px}
      p{font-size:13px;color:#5c6380;line-height:1.6;margin:0}</style>
      <div class="b"><h1>Модуль «${m.title}» ещё не сделан</h1>
      <p>Готовы и работают: Заказы, Производство, Склад. Этот раздел — следующий на очереди.</p></div>`;
    return;
  }

  loading.classList.remove('hide');
  document.getElementById('fl-text').textContent = 'Загрузка: ' + m.title + '…';
  frame.removeAttribute('srcdoc');
  frame.src = m.file;
  /* раздел обязан отчитаться о готовности; если молчит — объясняем,
     а не оставляем белый экран */
  frame._ready = false;
  clearTimeout(frame._watch);
  frame._watch = setTimeout(() => {
    if(frame._ready) return;
    loading.classList.remove('hide');
    document.getElementById('fl-text').innerHTML =
      'Раздел «' + m.title + '» не открылся.<br>' +
      '<span style="font-size:12px;color:#9fa6c0;line-height:1.7;display:block;margin-top:6px">' +
      'Попробуйте обновить страницу клавишами Cmd+R.<br>' +
      'Если не помогает — откройте файл в Google Chrome:<br>' +
      'в Safari большие страницы иногда не загружаются.</span>';
  }, 5000);
  // если файла нет рядом — покажем понятную ошибку, а не браузерный 404
  clearTimeout(frame._t);
  frame._t = setTimeout(() => {
    if(!frame._ok){
      loading.classList.add('hide');
      frame.srcdoc = `<style>body{margin:0;font-family:-apple-system,sans-serif;background:#f0f3fa;padding:40px;text-align:center}
        h1{font-size:16px;color:#a32d2d}p{font-size:13px;color:#5c6380;line-height:1.6}</style>
        <h1>Файл ${m.file} не найден</h1>
        <p>Положите все файлы Kasymov ERP в одну папку:<br>
        kasymov-main.html, kasymov-orders.html, kasymov-production.html,<br>
        kasymov-warehouse.html, kasymov-data.js, kasymov-ui.css</p>`;
    }
  }, 2500);
}

/* ── обмен с модулем ────────────────────────────── */
window.addEventListener('message', e => {
  const d = e.data;
  if(!d || d.ns !== 'kasymov') return;
  const frame = document.getElementById('main-frame');

  if(d.type === 'moduleError'){
    const box = document.getElementById('err-box');
    if(box){ box.hidden = false;
      box.innerHTML = '<b>Сбой внутри раздела.</b> ' + (d.msg || '') +
        '<div style="font-size:11px;opacity:.75;margin-top:4px">покажите это сообщение разработчику</div>'; }
    return;
  }
  if(d.type === 'ready'){
    const fr = document.getElementById('main-frame'); if(fr) fr._ready = true;
    frame._ok = true;
    document.getElementById('frame-loading').classList.add('hide');
    frame.contentWindow.postMessage({ ns:'kasymov', type:'state', state:Object.assign(K.clone(STATE), { me:ME }) }, '*');
  }
  if(d.type === 'goto' && d.page){ go(d.page); return; }
  if(d.type === 'commit'){
    if(window.KasymovDB && window.KasymovDB.ready) window.KasymovDB.save(d.state);
    STATE = d.state;      // модуль изменил данные — принимаем и обновляем счётчики
  }
});

function doAction(){
  if(MODULES[page] && MODULES[page].file){
    document.getElementById('main-frame').contentWindow.postMessage(
      { ns:'kasymov', type:'action', name:'primary' }, '*');
  } else {
    go('orders');
    setTimeout(() => document.getElementById('main-frame').contentWindow
      .postMessage({ ns:'kasymov', type:'action', name:'primary' }, '*'), 700);
  }
}

/* ── дашборд ────────────────────────────────────── */

const sv = (c,d) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  orders:     sv('#0c447c','<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'),
  production: sv('#8a5410','<path d="M3 21h18M5 21V9l5 3V9l5 3V7l4 2v12"/>'),
  warehouse:  sv('#3b6d11','<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 21v-9h6v9"/>'),
  finance:    sv('#5c6380','<path d="M3 20h18M7 16V9M12 16V5M17 16v-4"/>'),
};

function mod(id, iconBg, icon, title, sub, badgeTxt, bBg, bColor){
  return `<button class="module-card" onclick="go('${id}')">
    <span class="mc-icon" style="background:${iconBg}">${icon}</span>
    <span><span class="mc-title" style="display:block">${title}</span>
    <span class="mc-sub" style="display:block">${sub}</span>
    <span class="mc-badge" style="background:${bBg};color:${bColor}">${badgeTxt}</span></span></button>`;
}

function badge(id, n, cls){
  const el = document.getElementById(id);
  if(!el) return;
  if(!n){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = n;
  const c = { bl:['#e6f1fb','#0c447c'], am:['#faeeda','#8a5410'], rd:['#fcebeb','#a32d2d'] }[cls] || ['#eef1f7','#5c6380'];
  el.style.background = c[0]; el.style.color = c[1];
}

/* ── сайдбар ────────────────────────────────────── */
function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const on = sb.classList.toggle('collapsed');
  document.getElementById('sb-toggle').textContent = on ? '▶' : '◀';
}

/* ── старт ──────────────────────────────────────── */
const start = MODULES[(location.hash || '').slice(1)] ? location.hash.slice(1) : 'dashboard';
go(MODULES[start] || start === 'guide' ? start : 'home');
window.addEventListener('hashchange', () => {
  const p = (location.hash || '#home').slice(1);
  if(p !== page) go(MODULES[p] || p === 'guide' ? p : 'home');
});
</script>

<script>
(function(){
 function wire(){
   var u=document.querySelector('#shell .sb-user');
   if(!u||u.dataset.adminMenu)return;
   u.dataset.adminMenu='1';
   u.style.cursor='pointer';
   var menu=document.createElement('div');
   menu.id='admin-menu';
   menu.style.cssText='position:fixed;display:none;z-index:2000;min-width:200px;background:#16233a;border:1px solid rgba(255,255,255,.12);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:6px;font:600 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
   var head=document.createElement('div');
   head.textContent='Арген Баетов';
   head.style.cssText='padding:8px 12px 6px;color:#8a93a6;font-size:12px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px';
   menu.appendChild(head);
   var item=document.createElement('div');
   item.textContent='⚙ Админ-панель';
   item.style.cssText='padding:10px 12px;color:#eef3fb;border-radius:7px;cursor:pointer';
   item.onmouseenter=function(){item.style.background='rgba(255,255,255,.08)';};
   item.onmouseleave=function(){item.style.background='transparent';};
   item.onclick=function(e){e.stopPropagation();menu.style.display='none';window.open('admin.html','_blank');};
   menu.appendChild(item);
   document.body.appendChild(menu);
   u.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
     if(menu.style.display==='block'){menu.style.display='none';return;}
     menu.style.display='block';var r=u.getBoundingClientRect();
     menu.style.left=r.left+'px';menu.style.top=(r.top-menu.offsetHeight-8)+'px';});
   document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target!==u){menu.style.display='none';}});
 }
 if(document.readyState!=='loading')wire();else document.addEventListener('DOMContentLoaded',wire);
 setInterval(wire,1500);
})();
</script>
